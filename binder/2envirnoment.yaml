name: hsf-india
channels:
  - defaults
  - nvidia/label/cuda-12.4.1
  - conda-forge
dependencies:
  - python=3.10
  - libcurand
  - libcurand-dev
  - cuda-minimal-build=12.4
  - nomkl
  - pip
  - numpy
  - scipy
  - pandas==1.5.3
  - h5py
  - matplotlib
  - numba
  - pycuda
  - openmc  # Install OpenMC from Conda-Forge
  - pip:
      - torch==2.3.0
      - torchvision
      - jupyterlab
      - seaborn
      - imageio
variables:
  LD_LIBRARY_PATH: "'$LD_LIBRARY_PATH:$CONDA_PREFIX/lib/'"
  XLA_FLAGS: "'--xla_gpu_cuda_data_dir=$CONDA_PREFIX/'"
