name: hsf-india-req
channels:
  - defaults
  - nvidia/label/cuda-12.4.1
  - conda-forge
dependencies:
  - python=3.10
#  - cuda=12.4 
#  - cudnn=8.9.7
  - libcurand
  - libcurand-dev
  - cuda-minimal-build=12.4
  - nomkl #remove the large mkl lib stuff
  - pip
  - zstandard
  - zstd
  - clang-tools
  # LLVM's OpenMP target runtime is used to build the OpenMC NVIDIA GPU port.
  - conda-forge::clangxx=18.1.8
  - conda-forge::llvm-openmp=18.1.8
  - conda-forge::cmake
  - conda-forge::cython=0.29.37
  - conda-forge::hdf5=1.14
  - conda-forge::lxml
  - conda-forge::uncertainties
  - fsspec
  - lz4
  - pyarrow
  - python-xxhash
  # rapids drops support for the SSL/River GPUs after this release..
  # older releases do not support python 3.11
  - rapidsai::cudf=23.12.00
  - pip:
#      - tensorflow==2.16.1
#      - tensorrt
      - astunparse
      - awkward
      - dask
      - dask-awkward
      - distributed
      - h5py
      - hepunits
      - hist
      - ipympl
      - jupyterlab-deck
      - jupyterlab-mathjax3
      - matplotlib
      - numba
      - numexpr
      # OpenMC GPU 0.13 and the pinned RAPIDS/Pandas stack require NumPy 1.x.
      - numpy<2
      - scipy<1.14
      #cudf does not support pandas 2.0 until 24.0
      - pandas==1.5.3
      - particle
      - protobuf
      - pycuda
      - pybind11
      - scikit-learn
      - tables
      - uproot
      - vector
      - mplhep
      - requests
      - aiohttp
      - jax[cpu]
      - graphviz
      - dask-labextension==6.2.0
      - torch==2.3.0
      - torchvision
      - torchvision
      - torchaudio
      - seaborn

     
variables:
  LD_LIBRARY_PATH: "'$LD_LIBRARY_PATH:$CONDA_PREFIX/lib/'"
  XLA_FLAGS: "'--xla_gpu_cuda_data_dir=$CONDA_PREFIX/'"
# not needed for Delhi setup
#  NUMBA_CUDA_ENABLE_MINOR_VERSION_COMPATIBILITY: "1"
  
