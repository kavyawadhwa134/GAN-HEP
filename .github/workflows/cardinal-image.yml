name: Build CARDINAL image

on:
  workflow_dispatch:
    inputs:
      build_jobs:
        description: Parallel compiler jobs
        required: true
        default: "8"

permissions:
  contents: read
  packages: write

concurrency:
  group: cardinal-container-image
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.repository_owner == 'kavyawadhwa134'
    runs-on: [self-hosted, linux, x64, cardinal-builder]
    timeout-minutes: 720

    steps:
      - name: Check out the cardinal branch
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/cardinal.Dockerfile
          push: true
          build-args: |
            BUILD_JOBS=${{ inputs.build_jobs }}
          tags: |
            ghcr.io/kavyawadhwa134/gan-hep-cardinal:runtime
            ghcr.io/kavyawadhwa134/gan-hep-cardinal:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/kavyawadhwa134/GAN-HEP
          cache-from: type=local,src=/var/cache/cardinal-buildx
          cache-to: type=local,dest=/var/cache/cardinal-buildx-new,mode=max

      - name: Replace the reusable build cache
        run: |
          sudo rm -rf /var/cache/cardinal-buildx
          sudo mv /var/cache/cardinal-buildx-new /var/cache/cardinal-buildx
